<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>K.I.R.A</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F172A">
  <!-- Polices et icônes embarquées (angular.json > styles) : aucune connexion Internet requise. -->
  <script>
    (function() {
      var t = localStorage.getItem('kira-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
