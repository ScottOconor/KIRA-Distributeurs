spring.application.name=Blessing ERP
server.port=8085


# Database — valeurs de dev par défaut UNIQUEMENT ; en production ces valeurs sont surchargées
# par config/application.properties (hors du projet livré, voir config/application.properties.example).
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_base
spring.datasource.username=automate
spring.datasource.password=automate
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Africa/Douala

# JWT — secret auto-généré et persisté au premier démarrage si non fourni explicitement
# (voir JwtService.resolveSecret). Rien à configurer ici.
jwt.expiration=86400000

# Par défaut Spring Boot rejoue toute la chaîne de filtres Security (dont l'AuthorizationFilter de
# .authorizeHttpRequests()) sur le redispatch ASYNC en plus du REQUEST initial. Les endpoints
# StreamingResponseBody (exports GET .../orders|invoices|avoirs) déclenchent ce redispatch une fois
# le body déjà envoyé (réponse "committed") — et comme JwtAuthFilter/PermissionFilter (OncePerRequestFilter)
# ne rejouent PAS sur ASYNC par construction, l'AuthorizationFilter s'y retrouve sans SecurityContext et
# lève un AccessDeniedException tardif, que Spring ne peut plus traduire en réponse d'erreur (response
# already committed) — cascade visible dans erp.log ("Cannot dispatch without an AsyncContext"). On
# aligne donc la chaîne Security sur le comportement des filtres custom : REQUEST/ERROR uniquement.
spring.security.filter.dispatcher-types=REQUEST,ERROR

# Logging — DEBUG sur la sécurité/web loggue le détail des requêtes et du flux d'authentification
# (headers, décisions de filtre) : verbeux et potentiellement sensible en production.
logging.level.com.erp=INFO
logging.level.com=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
# Fichier de log positionné à côté du JAR (LOG_PATH calculé au démarrage, cf. ErpApplication) —
# un seul fichier consolidé, aucune configuration manuelle de chemin nécessaire, portable quel
# que soit l'endroit où le JAR tourne.
logging.file.name=${LOG_PATH}/logs/erp.log

# ==============================
# Hub & Spoke - Synchronisation
# ==============================
# Identifiant unique de ce spoke (distributeur)
sync.spoke.id=test
sync.spoke.name=test-distributor

# Intervalle d'envoi des événements vers le Hub (ms)
sync.dispatch.interval-ms=30000
# Snapshot complet toutes les heures (3 600 000 ms). Initial delay = 1 min après démarrage.
sync.snapshot.interval-ms=3600000
sync.snapshot.initial-delay-ms=60000

# RabbitMQ — identifiants externalisés en variables d'environnement (RABBITMQ_USER/PASSWORD) ;
# les valeurs ici ne servent que de repli en dev local. ATTENTION : le mot de passe actuel a été
# committé en clair dans l'historique git — il doit être régénéré côté broker RabbitMQ et
# l'historique git nettoyé, ce qu'aucun outil de ce projet ne peut faire automatiquement.
# RabbitMQ
spring.rabbitmq.host=localhost
#pring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=kira
spring.rabbitmq.password=Kira@RMQ2024!
spring.rabbitmq.virtual-host=/
# URL du Hub pour test de connectivité
hub.health.url=http://localhost:8090
# URL publique de ce spoke (pour que le Hub puisse le pinguer depuis le cloud).
# Laisser vide = auto-détection via IP publique (api.ipify.org).
# Exemple si domaine : sync.spoke.public-url=https://spoke1.mondomaine.com
# Exemple avec IP fixe : sync.spoke.public-url=http://41.202.x.x:8085
sync.spoke.public-url=

# Licensing on-premise (liée au Hub via l'URL configurée dans l'écran Config > Agences distantes)
license.file.path=${LICENSE_FILE_PATH:${user.home}/.kira/license/license.lic}
# Clé(s) publique(s) RSA du Hub, utilisées pour vérifier la signature des licences — récupérées
# automatiquement au démarrage depuis le Hub configuré (hub.health.url) si absentes ; jamais
# écrasées une fois présentes (cf. LicenseService.fetchHubPublicKeyIfNeeded).
hub.license.public-keys-dir=${HUB_LICENSE_PUBLIC_KEYS_DIR:${user.home}/.kira/license/hub-public-keys}
license.recheck.interval-ms=1800000
license.recheck.initial-delay-ms=60000
license.clock-skew-tolerance-ms=300000
license.contact.fallback-email=kairosinnovationtechnology@gmail.com
license.contact.fallback-phone=+237 641 84 35 61
