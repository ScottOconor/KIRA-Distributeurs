spring.application.name=Blessing ERP

# Secrets (mots de passe PostgreSQL et RabbitMQ) : jamais dans ce fichier versionné. Ils viennent de
# variables d'environnement (KIRA_DB_PASSWORD, KIRA_RABBITMQ_PASSWORD), de config/application.properties
# à côté du JAR (voir config/application.properties.example), ou, sur un poste de développement, de
# ~/.kira/application.properties (même dossier que le secret JWT).
spring.config.import=optional:file:${user.home}/.kira/application.properties
server.port=8085


# Database — valeurs de dev par défaut UNIQUEMENT ; en production ces valeurs sont surchargées
# par config/application.properties (hors du projet livré, voir config/application.properties.example).
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_base
spring.datasource.username=automate
spring.datasource.password=${KIRA_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool par défaut (10) vidé en prod le 2026-10-02 : snapshots longs + listes en streaming.
spring.datasource.hikari.maximum-pool-size=25
# Trace dans le log toute connexion gardée plus de 2 min (le snapshot horaire, ~15 min, y apparaîtra : normal).
spring.datasource.hikari.leak-detection-threshold=120000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Fichiers reçus : la limite par défaut (1 Mo) empêchait de restaurer toute sauvegarde réelle
# (une base de quelques dizaines de Mo donne déjà un ZIP de 2 Mo). Au-delà du seuil, Tomcat écrit
# le fichier sur disque au lieu de le garder en mémoire.
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=1MB

# Origines autorisées à appeler l'API depuis un AUTRE site (séparées par des virgules), ex.
# cors.allowed-origins=https://outil.mondomaine.com — vide : l'interface servie par ce serveur suffit.
cors.allowed-origins=

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Africa/Douala

# JWT — secret auto-généré et persisté au premier démarrage si non fourni explicitement
# (voir JwtService.resolveSecret). Rien à configurer ici.
jwt.expiration=86400000

# Par défaut Spring Boot rejoue toute la chaîne de filtres Security (dont l'AuthorizationFilter de
# .authorizeHttpRequests()) sur le redispatch ASYNC en plus du REQUEST initial. Les endpoints
# StreamingResponseBody (exports GET .../orders|invoices|avoirs) déclenchent ce redispatch une fois
# le body déjà envoyé (réponse "committed") — et comme JwtAuthFilter/PermissionFilter (OncePerRequestFilter)
# ne rejouent PAS sur ASYNC par construction, l'AuthorizationFilter s'y retrouve sans SecurityContext et
# lève un AccessDeniedException tardif, que Spring ne peut plus traduire en réponse d'erreur (response
# already committed) — cascade visible dans erp.log ("Cannot dispatch without an AsyncContext"). On
# aligne donc la chaîne Security sur le comportement des filtres custom : REQUEST/ERROR uniquement.
spring.security.filter.dispatcher-types=REQUEST,ERROR

# Logging
# INFO : le niveau DEBUG (com.*, Spring Security et Spring Web) écrivait dans le journal les corps
# de requêtes — mots de passe de connexion et de création d'utilisateur compris — et le mot de
# passe de la base. À n'activer que ponctuellement, pour un diagnostic.
logging.level.com.erp=INFO
logging.level.com=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
# Fichier de log positionné à côté du JAR (LOG_PATH calculé au démarrage, cf. ErpApplication) —
# un seul fichier consolidé, aucune configuration manuelle de chemin nécessaire, portable quel
# que soit l'endroit où le JAR tourne.
logging.file.name=${LOG_PATH}/logs/erp.log

# ==============================
# Hub & Spoke - Synchronisation
# ==============================
# Identifiant unique de ce spoke (distributeur)
sync.spoke.id=test
sync.spoke.name=test-distributor

# Intervalle d'envoi des événements vers le Hub (ms)
sync.dispatch.interval-ms=30000
# Snapshot complet toutes les heures (3 600 000 ms). Initial delay = 1 min après démarrage.
sync.snapshot.interval-ms=3600000
sync.snapshot.initial-delay-ms=60000

# RabbitMQ — identifiants externalisés en variables d'environnement (RABBITMQ_USER/PASSWORD) ;
# les valeurs ici ne servent que de repli en dev local. ATTENTION : le mot de passe actuel a été
# committé en clair dans l'historique git — il doit être régénéré côté broker RabbitMQ et
# l'historique git nettoyé, ce qu'aucun outil de ce projet ne peut faire automatiquement.
# RabbitMQ
spring.rabbitmq.host=localhost
#pring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=kira
spring.rabbitmq.password=${KIRA_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=/
# Sans confirms, rabbitTemplate.convertAndSend() rend la main dès que le frame est écrit sur le
# socket : si le broker refuse ensuite le message (ex: taille max dépassée, fermeture de channel),
# ce rejet arrive de façon asynchrone et l'événement outbox reste marqué SENT alors qu'il n'a
# jamais été livré au hub — silencieux, invisible dans l'UI (cf. incident Blessing "Forcer envoi"
# du 2026-09-17 : succès affiché côté spoke, rien ne remonte au hub). Les confirms permettent à
# SyncDispatcherScheduler.confirmCallback de détecter ce cas et de remettre l'événement en PENDING
# avec l'erreur réelle du broker.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# URL du Hub pour test de connectivité
hub.health.url=http://localhost:8090
# URL publique de ce spoke (pour que le Hub puisse le pinguer depuis le cloud).
# Laisser vide = auto-détection via IP publique (api.ipify.org).
# Exemple si domaine : sync.spoke.public-url=https://spoke1.mondomaine.com
# Exemple avec IP fixe : sync.spoke.public-url=http://41.202.x.x:8085
sync.spoke.public-url=

